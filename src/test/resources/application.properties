spring.application.name=test-api-test

# Active test profile
spring.profiles.active=test

# Safety guard: Prevent tests from hitting local development MySQL on port 3306.
# Tests using Testcontainers will dynamically override these properties via @DynamicPropertySource.
spring.datasource.url=jdbc:mysql://127.0.0.1:65534/isolated_test_db_safety_placeholder
spring.datasource.username=safety_user
spring.datasource.password=safety_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=15000
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
