spring.application.name=test-api

# Datasource configuration with environment variable overrides and local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/franchise_db}
spring.datasource.username=${DB_USERNAME:franchise_user}
spring.datasource.password=${DB_PASSWORD:franchise_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false

# Default profile for local execution when no active profile is specified
spring.profiles.default=dev
